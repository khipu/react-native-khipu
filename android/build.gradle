buildscript {
  // Buildscript is evaluated before everything else so we can't use getExtOrDefault
  def kotlin_version = rootProject.ext.has("kotlinVersion") ? rootProject.ext.get("kotlinVersion") : project.properties["Khipu_kotlinVersion"]

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:7.2.1"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"

  // TurboModule codegen. `libraryName` must match `codegenConfig.name` in
  // package.json. This lives inside the guard because the `react { }` block is
  // contributed by the plugin applied just above.
  react {
    jsRootDir = file("../src/")
    libraryName = "KhipuSpec"
    codegenJavaPackageName = "com.khipu"
  }
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["Khipu_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["Khipu_" + name]).toInteger()
}

def supportsNamespace() {
  def parsed = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')
  def major = parsed[0].toInteger()
  def minor = parsed[1].toInteger()

  // Namespace support was added in 7.3.0
  return (major == 7 && minor >= 3) || major >= 8
}

android {
  // La *declaracion* del modulo depende de la arquitectura y la logica no:
  //   src/main/java/com/khipu/KhipuModuleImpl.kt   -> la logica, una sola vez
  //   src/newarch/java/com/khipu/KhipuModule.kt    -> extiende NativeKhipuSpec (codegen)
  //   src/oldarch/java/com/khipu/KhipuModule.kt    -> ReactContextBaseJavaModule + @ReactMethod
  // Solo uno de los dos entra al compilador, elegido por el mismo predicado que
  // decide si se aplica el plugin `com.facebook.react` (y por lo tanto si existe
  // la clase generada). Sin esto, la arquitectura vieja muere con
  // "Unresolved reference 'NativeKhipuSpec'".
  sourceSets.main.java.srcDirs += isNewArchitectureEnabled() ? ['src/newarch/java'] : ['src/oldarch/java']

  if (supportsNamespace()) {
    namespace "com.khipu"

    sourceSets {
      main {
        manifest.srcFile "src/main/AndroidManifestNew.xml"
      }
    }
  }

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")

  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  // JVM unit tests for the module logic. Without this, every android.jar stub
  // throws "not mocked" and the tests cannot construct so much as an Intent.
  testOptions {
    unitTests.returnDefaultValues = true
  }
}

// El plugin de Gradle de React Native fija el target de Java de este modulo por
// encima del compileOptions de arriba: 11 en RN 0.72, 17 desde 0.73. Si no
// fijamos ademas el de Kotlin, este toma por defecto la version del JDK de quien
// compila y el build falla con "Inconsistent JVM-target compatibility detected".
// Medido en RN 0.72.17 con JDK 17: Java quedaba en 11 y Kotlin en 17.
// Por eso se resuelve en afterEvaluate, cuando React Native ya aplico el suyo,
// en vez de fijar un numero que romperia la otra punta del rango soportado.
afterEvaluate {
  tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
      jvmTarget = android.compileOptions.targetCompatibility.toString()
    }
  }
}

repositories {
  mavenCentral()
  google()
}

def kotlin_version = getExtOrDefault("kotlinVersion")

dependencies {
  // For < 0.71, this will be from the local maven repo
  // For > 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
  // 2.28.5 o mas nuevo es obligatorio. Hasta 2.28.0 un mensaje de socket que no se
  // pudiera deserializar explotaba en el hilo del socket SIN try/catch y mataba el
  // proceso de la app del comercio. El guard llego en 2.28.1 (IKW-1232), 2.28.3
  // incluyo OPERATION_WARNING entre los terminales (IKW-1237), y 2.28.4 hace que un
  // terminal indescifrable llame a returnToApp(): recien ahi la promesa RESUELVE
  // sola, con result="ERROR" y failureReason=null, en vez de dejar al pagador
  // varado (IKW-1240). Verificado en el AAR publicado: runGuarded nombra
  // returnToApp, que no estaba en 2.28.3.
  //
  // 2.28.5 cierra IKW-1247, que es el peor de la serie para nosotros: KhipuCookieJar
  // guardaba las cookies en un HashSet sin sincronizar, y OkHttp lo llama desde varios
  // hilos del Dispatcher a la vez. El ConcurrentModificationException corre en un hilo
  // de fondo y NO esta atrapado, asi que mata el proceso. Cuando el proceso muere no
  // hay callback ni excepcion: la promesa no resuelve NI rechaza, desaparece. Es el
  // unico modo de falla conocido donde el puente no puede devolver nada, porque no
  // queda proceso donde correr el reject.
  // Verificado en el AAR publicado, con control diferencial contra 2.28.4:
  //   javap -p com/khipu/client/socket/KhipuCookieJar.class
  //     2.28.5: public synchronized void saveFromResponse(...)  / synchronized loadForRequest
  //     2.28.4: public void saveFromResponse(...)               / sin synchronized
  //   y en las DOS versiones persistToDisk y saveCookie siguen en `private final`,
  //   que es el control positivo: el chequeo no esta marcando todo como sincronizado.
  // OJO con el marcador intuitivo: contar `monitorenter` da 0 en la version ARREGLADA
  // y seria un falso negativo. @Synchronized a nivel de metodo pone ACC_SYNCHRONIZED
  // en el descriptor, no emite esa instruccion.
  implementation 'com.khipu:khipu-client-android:2.28.5'

  // Test-only: never reaches the AAR merchants consume.
  testImplementation "junit:junit:4.13.2"
  testImplementation "org.mockito:mockito-core:5.12.0"
  testImplementation "org.mockito.kotlin:mockito-kotlin:5.3.1"
}

