# Dependabot keeps two things current: the JavaScript tooling (every package in the root
# is a devDependency or a peer) and the GitHub Actions the CI runs on. Aligned with
# cordova-khipu, capacitor-khipu and flutter_khipu.
#
# Left out on purpose:
# - The native SDK pins. khipu-client-android lives in android/build.gradle and
#   KhipuClientIOS in react-native-khipu.podspec; Dependabot reads neither here (there
#   is no gradle entry, and it does not parse podspecs). Moving an SDK is a release
#   decision, made by hand.
# - React Native itself. Going from 0.87 to 0.88 is a "minor" to Dependabot, so it
#   would land inside the tooling group, but it means following the upgrade template
#   across Gradle, the Podfile and the Gemfile of the example. Security updates still
#   come through: `ignore` only applies to version updates.
version: 2
updates:
  # Yarn workspaces: the root holds the only lockfile and covers example/ too.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # A published package defaults to `widen`, which turns "^21.1.0" into
    # ">=21.1.0 <23.0.0". For devDependencies that only blurs what is installed.
    versioning-strategy: increase
    # A new release waits a week before it is proposed, which gives the registry time to
    # pull a compromised one. Security updates ignore this and arrive at once.
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: react-native
      - dependency-name: react
      - dependency-name: "@react-native/*"
      - dependency-name: "@react-native-community/*"
      # React Native's Babel preset is on Babel 7 (@react-native/babel-preset 0.87.1 depends
      # on @babel/core ^7.25.2), so a Babel major moves with the React Native template.
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
      # @react-native/eslint-config 0.87.1 declares eslint ^8.0.0 || ^9.0.0, so an ESLint
      # major waits until the React Native config accepts it (ESLint 10 was #38).
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is the native rewrite; how it fits codegen, @typescript-eslint and bob
      # on React Native 0.87 is not verified yet (#36), so a major is its own investigation.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      # Majors stay out of the group and arrive one per pull request. They are where the
      # Node floor moves: release-it 21 and commitlint 21 both dropped Node 20.
      tooling:
        patterns: ["*"]
        update-types: [minor, patch]
      # Only takes effect once security updates are enabled in the repository settings.
      security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope

  # No group: the workflows pin major tags (@v7), so every update here is a major, and one
  # pull request each keeps a breaking one attributable.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
