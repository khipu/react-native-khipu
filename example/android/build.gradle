buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

// El SDK de Android de Khipu vive en el Nexus de Khipu, no en Maven Central ni
// en el repo de Google. Sin esto la resolucion falla con
// "Could not find com.khipu:khipu-client-android". Es el mismo bloque que el
// README le pide agregar al comercio.
allprojects {
    repositories {
        maven { url 'https://dev.khipu.com/nexus/content/repositories/khenshin' }
    }
}

apply plugin: "com.facebook.react.rootproject"
